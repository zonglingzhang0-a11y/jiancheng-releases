<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- 16 像素专用：按 16 格对齐，地平线、亮边、星点都落在整像素上 -->
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#17181b"/><stop offset=".6" stop-color="#2f3035"/><stop offset="1" stop-color="#6f7076"/></linearGradient>
    <linearGradient id="gd" x1="0" x2="0" y1="10" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a4b51"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
    <radialGradient id="glow"><stop offset=".3" stop-color="#9a9ba1" stop-opacity=".5"/><stop offset="1" stop-color="#9a9ba1" stop-opacity="0"/></radialGradient>
    <clipPath id="rr"><rect width="16" height="16" rx="3.5"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect width="16" height="16" fill="url(#sky)"/>
    <circle cx="8" cy="10" r="7.5" fill="url(#glow)"/>
    <circle cx="8" cy="10" r="4.6" fill="#cfd0d2"/>
    <rect y="10" width="16" height="6" fill="url(#gd)"/>
    <rect y="12" width="16" height="1" fill="#fafaf9" opacity=".26"/>
  </g>
  <circle cx="13" cy="3.5" r="1.6" fill="#fafaf9"/>
</svg>
