appId: com.zzl.tempo
productName: 简程
copyright: Copyright © 2026 zzl
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# koffi 的原生库位于 @koromix/koffi-<平台> 包中，需要解包到 asar 之外才能加载
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: resources/tray-light.ico
    to: tray-light.ico
  - from: resources/tray-dark.ico
    to: tray-dark.ico
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
win:
  # 16–24 像素用裁到地平线的特写，32 以上用完整画面；由 npm run icons 从 resources/icon-src 生成
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Jiancheng-Setup-${version}.exe
  shortcutName: 简程
  uninstallDisplayName: 简程 ${version}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
npmRebuild: false
# 自动更新：安装包发布到 GitHub 仓库的 Releases（源码也在同一个仓库，MIT 开源）
publish:
  provider: github
  owner: zonglingzhang0-a11y
  repo: jiancheng-releases
  releaseType: release
